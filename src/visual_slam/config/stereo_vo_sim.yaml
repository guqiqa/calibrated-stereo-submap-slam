stereo_vo_sim:
  ros__parameters:
    left_topic: /sim/left/image_raw
    right_topic: /sim/right/image_raw
    left_info_topic: /sim/left/camera_info
    right_info_topic: /sim/right/camera_info
    odometry_topic: /visual_slam/odometry_sim
    status_topic: /visual_slam/status_sim
    max_pair_delta_ms: 10.0
    processing_scale: 0.75
    max_features: 1200
    max_disparity: 160.0
    min_disparity: 2.0
    stereo_epipolar_tolerance_px: 2.0
    stereo_reprojection_error_px: 1.5
    temporal_match_distance: 52
    min_stereo_points: 35
    min_pnp_inliers: 18
    max_depth_m: 25.0
    min_3d3d_inliers: 20
    max_3d3d_residual_m: 0.08
    motion_translation_tolerance_m: 0.20
    motion_rotation_tolerance_deg: 8.0
    stable_map_min_observations: 2
    motion_reference_frames: 5
    motion_reference_translation_m: 0.04
    planar_motion_constraint: true
    straight_motion_constraint: true
    stereo_translation_scale_factor: 1.08
    loop_closure_enabled: true
    loop_closure_apply_correction: false
    loop_check_period_frames: 15
    loop_min_keyframe_gap: 8
    loop_min_matches: 35
    loop_min_inliers: 25
    loop_max_reprojection_px: 2.5
    initial_gazebo_x: 0.08
    initial_gazebo_y: 0.035
    initial_gazebo_z: 0.32
    fallback_baseline_m: 0.07
    odom_frame: visual_odom_sim
    camera_frame: stereo_left_optical_frame
    submap_mode: joint
    submap_length_m: 5.0
    submap_overlap_m: 1.5
    candidate_count: 3
    representative_keyframes: 3
    local_window_keyframes: 15
    keyframe_distance_m: 0.3
    keyframe_angle_deg: 5.0
    switch_confirm_frames: 3
    switch_min_matches: 30
    switch_min_inliers: 20
    switch_max_reprojection_px: 3.0
    smooth_transition_frames: 5
    map_fusion_radius_m: 0.10
